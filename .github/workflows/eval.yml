name: quality-gate

on: [pull_request]

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 06-lab-complete/benchmark-observability/develop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run agent and quality gate
        shell: bash
        run: |
          set -euo pipefail
          AGENT_VERSION=v2 MOCK_ERROR_RATE=0 PORT=8002 python app.py > agent-eval.log 2>&1 &
          AGENT_PID=$!
          trap 'kill -TERM "$AGENT_PID" 2>/dev/null || true; wait "$AGENT_PID" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl -fsS http://localhost:8002/health >/dev/null; then
              break
            fi
            if ! kill -0 "$AGENT_PID" 2>/dev/null; then
              cat agent-eval.log
              exit 1
            fi
            sleep 0.25
          done
          curl -fsS http://localhost:8002/health >/dev/null
          python eval/run_eval.py --url http://localhost:8002 \
            --min-accuracy 0.85 --baseline reports/eval_v2_fixed.json \
            --out reports/eval_ci.json
